version: '3.8'

services:
  pdf-extraction-api:
    build:
      context: ../../../..
      dockerfile: src/pdf_reader/adapters/http/Dockerfile
    image: pdf-extraction-api:latest
    container_name: pdf-extraction-api
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for input/output
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
      # Mount config files
      - ./configs:/app/configs:ro
    environment:
      # Logging configuration
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      # LLM configuration (if using fallback)
      - PDF_READER_LLM_API_KEY=${LLM_API_KEY:-}
      - PDF_READER_LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - PDF_READER_LLM_MODEL=${LLM_MODEL:-gpt-4o}
      # Service configuration
      - MAX_UPLOAD_SIZE=100MB
      - WORKER_TIMEOUT=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - pdf-extraction-network

  # Optional: Redis for production job storage
  redis:
    image: redis:7-alpine
    container_name: pdf-extraction-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pdf-extraction-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: pdf-extraction-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pdf-extraction-api
    restart: unless-stopped
    networks:
      - pdf-extraction-network

volumes:
  redis-data:

networks:
  pdf-extraction-network:
    driver: bridge


